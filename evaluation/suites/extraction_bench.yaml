name: extraction-benchmark
cases:
  # Case 1: Multi-step admin task (login + navigate + extract)
  - id: admin-shop-hours
    directive: >
      Go to http://localhost:8000/admin, use test@appliedlabs.ai for email
      and icarus9211 for the password, login, find the shop of the latest
      conversation sorted by creation date, and tell me the opening hours
      of that shop
    execution_mode: agent_only
    trials: 1
    allow_private_networks: true
    max_steps: 20
    benchmark_tags: [admin, login, extraction]
    output_schema:
      type: object
      properties:
        summary:
          type: string
        result:
          type: string
        details:
          type: object
      required:
        - summary
        - result
    expect:
      must_succeed: true
      max_actions: 12

  # Case 2: Simple public page extraction
  - id: example-dot-com
    directive: Go to https://example.com and tell me the exact text of the heading and the first paragraph
    execution_mode: agent_only
    trials: 1
    max_steps: 8
    benchmark_tags: [public, simple, extraction]
    output_schema:
      type: object
      properties:
        summary:
          type: string
        result:
          type: string
        details:
          type: object
          properties:
            heading:
              type: string
            paragraph:
              type: string
          required:
            - heading
      required:
        - summary
        - result
    expect:
      must_succeed: true
      max_actions: 4

  # Case 3: Admin list page - count items
  - id: admin-count-shops
    directive: >
      Go to http://localhost:8000/admin, use test@appliedlabs.ai for email
      and icarus9211 for the password, login, go to the Shops section,
      and tell me how many shops are listed
    execution_mode: agent_only
    trials: 1
    allow_private_networks: true
    max_steps: 15
    benchmark_tags: [admin, login, counting]
    output_schema:
      type: object
      properties:
        summary:
          type: string
        result:
          type: string
        details:
          type: object
          properties:
            shop_count:
              type: string
      required:
        - summary
        - result
    expect:
      must_succeed: true
      max_actions: 10
