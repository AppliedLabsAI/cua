name: research
description: >
  Optimized for information gathering and summarization.
  Allows broader navigation and disables destructive action blocks
  since research tasks don't perform mutations.
prompt_extension: |
  ## Research Mode
  Your goal is information gathering. Follow these additional guidelines:
  - Read pages thoroughly before extracting data.
  - Prefer extract(selector, text) over reading raw DOM for content-heavy pages.
  - Cite the URL source for every piece of information you report.
  - If a page requires login and you don't have credentials, skip it and note the gap.
guardrail_overrides:
  blocked_action_categories: []
  max_urls_visited: 100
